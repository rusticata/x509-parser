[package]
name = "x509-parser"
version = "0.19.0-beta.1"
description = "Parser for the X.509 v3 format (RFC 5280 certificates)"
license = "MIT OR Apache-2.0"
keywords = ["X509","Certificate","parser","nom"]
authors = ["Pierre Chifflier <chifflier@wzdftpd.net>"]
homepage = "https://github.com/rusticata/x509-parser"
repository = "https://github.com/rusticata/x509-parser.git"
categories = ["parser-implementations", "cryptography"]
readme = "README.md"
edition = "2018"
rust-version = "1.85"

include = [
  "CHANGELOG.md",
  "LICENSE-*",
  "README.md",
  ".gitignore",
  ".travis.yml",
  "Cargo.toml",
  "src/*.rs",
  "src/extensions/*.rs",
  "src/validate/*.rs",
  "src/visitor/*.rs",
  "tests/*.rs",
  "assets/*.crl",
  "assets/*.csr",
  "assets/*.der",
  "assets/*.pem",
  "assets/crl-ext/*.der",
  "examples/*.rs"
]

[package.metadata.docs.rs]
# all features except verify-aws-fips (aws-lc-fips-sys cannot build on docs.rs)
features = ["validate", "verify", "verify-aws"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
verify-aws = ["aws-lc-rs/aws-lc-sys"] # Non-FIPS backend
verify-aws-fips = ["aws-lc-rs/fips"]  # FIPS crypto backend
verify = ["ring"]
validate = []

[dependencies]
asn1-rs = { version = "0.8.0-beta.1", features=["bigint", "datetime"] }
aws-lc-rs = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }
data-encoding = "2.2.1"
nom = "8.0"
oid-registry = { version="0.9.0-beta.1", features=["crypto", "x509", "x962"] }
ring = { version="0.17.12", optional=true }
rusticata-macros = "5.0"
thiserror = "2.0"
time = { version="0.3.41", features=["formatting"] }

[dev-dependencies]
hex-literal = "0.4"

[lints.rust]
unsafe_code = "forbid"
#missing_docs = "warn"
unstable_features = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
#pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
#print_stdout = "warn"
#print_stderr = "warn"
